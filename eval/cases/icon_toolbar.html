<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>商品管理后台</title>
<style>
  body { font-family: "Segoe UI", sans-serif; margin: 0; background: #fafafa; }
  h2 { margin: 16px 24px 8px; color: #333; }
  .toolbar { display: flex; gap: 14px; padding: 14px 24px; background: #fff;
             border-bottom: 1px solid #e0e0e0; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .toolbar button { width: 52px; height: 52px; border: 1px solid #d0d0d0; background: #fff;
             border-radius: 10px; cursor: pointer; display: flex; align-items: center;
             justify-content: center; padding: 0; }
  .toolbar button:hover { background: #e8f0fe; border-color: #90a4ae; }
  .hint { margin: 16px 24px; color: #666; }
</style>
</head>
<body>
<h2>商品管理后台</h2>
<div class="toolbar">
  <!-- 注意：以下按钮均无文本/aria/name/id —— DOM 通道拿不到任何语义线索 -->
  <button data-test="search" onclick="window.__clicked='search'" aria-hidden="true">
    <svg width="28" height="28" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6" fill="none" stroke="#37474f" stroke-width="2.5"/><line x1="15" y1="15" x2="21" y2="21" stroke="#37474f" stroke-width="2.5" stroke-linecap="round"/></svg>
  </button>
  <button data-test="cart" onclick="window.__clicked='cart'" aria-hidden="true">
    <svg width="28" height="28" viewBox="0 0 24 24"><path d="M2 4 L5 4 L7 15 L19 15 L21 7 L6 7" fill="none" stroke="#37474f" stroke-width="2.2" stroke-linejoin="round"/><circle cx="9" cy="19.5" r="1.8" fill="#37474f"/><circle cx="17" cy="19.5" r="1.8" fill="#37474f"/></svg>
  </button>
  <button data-test="favorite" onclick="window.__clicked='favorite'" aria-hidden="true">
    <svg width="28" height="28" viewBox="0 0 24 24"><path d="M12 20 C 4 14 2 9 6 6 C 8.5 4 11 5.5 12 7.5 C 13 5.5 15.5 4 18 6 C 22 9 20 14 12 20 Z" fill="#e53935"/></svg>
  </button>
  <button data-test="gear" onclick="window.__clicked='gear'" aria-hidden="true">
    <svg width="28" height="28" viewBox="0 0 24 24"><polygon points="12,2 15,5 19,5 19,9 22,12 19,15 19,19 15,19 12,22 9,19 5,19 5,15 2,12 5,9 5,5 9,5" fill="none" stroke="#37474f" stroke-width="2"/><circle cx="12" cy="12" r="3" fill="#37474f"/></svg>
  </button>
  <button data-test="camera" onclick="window.__clicked='camera'" aria-hidden="true">
    <svg width="28" height="28" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2" fill="none" stroke="#37474f" stroke-width="2.2"/><circle cx="12" cy="13.5" r="4" fill="none" stroke="#37474f" stroke-width="2.2"/><rect x="9" y="4" width="6" height="3" rx="1" fill="#37474f"/></svg>
  </button>
  <button data-test="print" onclick="window.__clicked='print'" aria-hidden="true">
    <svg width="28" height="28" viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="5" fill="none" stroke="#37474f" stroke-width="2"/><rect x="4" y="8" width="16" height="8" rx="1.5" fill="none" stroke="#37474f" stroke-width="2"/><rect x="8" y="14" width="8" height="7" fill="#fff" stroke="#37474f" stroke-width="1.8"/></svg>
  </button>
  <button data-test="download" onclick="window.__clicked='download'" aria-hidden="true">
    <svg width="28" height="28" viewBox="0 0 24 24"><polygon points="12,3 16,9 8,9" fill="#1565c0"/><rect x="10.8" y="9" width="2.4" height="7" fill="#1565c0"/><path d="M6 16 L6 20 L18 20 L18 16" fill="none" stroke="#1565c0" stroke-width="2.4"/></svg>
  </button>
  <button data-test="share" onclick="window.__clicked='share'" aria-hidden="true">
    <svg width="28" height="28" viewBox="0 0 24 24"><circle cx="6" cy="12" r="2.6" fill="#2e7d32"/><circle cx="18" cy="5" r="2.6" fill="#2e7d32"/><circle cx="18" cy="19" r="2.6" fill="#2e7d32"/><line x1="8.3" y1="10.8" x2="15.7" y2="6.2" stroke="#2e7d32" stroke-width="2"/><line x1="8.3" y1="13.2" x2="15.7" y2="17.8" stroke="#2e7d32" stroke-width="2"/></svg>
  </button>
</div>
<p class="hint">请通过工具栏图标完成操作。</p>
<script>window.__clicked = '';</script>
</body>
</html>
