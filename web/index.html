<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Browser-Agent 控制台</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d; --text: #e6edf3;
    --dim: #8b949e; --accent: #58a6ff; --green: #3fb950; --yellow: #d29922;
    --red: #f85149; --purple: #bc8cff; --cyan: #39c5cf;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Cascadia Code", Consolas, "Microsoft YaHei", monospace;
    font-size: 14px; height: 100vh; display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 14px; padding: 12px 20px;
    border-bottom: 1px solid var(--border); background: var(--panel);
  }
  header h1 { font-size: 17px; font-weight: 600; }
  header h1 span { color: var(--accent); }
  .badge {
    font-size: 11px; padding: 3px 10px; border-radius: 10px;
    border: 1px solid var(--border); color: var(--dim); white-space: nowrap;
  }
  .badge.ok { color: var(--green); border-color: var(--green); }
  .badge.warn { color: var(--yellow); border-color: var(--yellow); }
  #ws-state { margin-left: auto; }
  select.badge {
    background: var(--panel); color: var(--text); cursor: pointer;
    font-family: inherit; outline: none; max-width: 220px;
  }
  select.badge option { background: var(--panel); color: var(--text); }
  select.badge.no-key { color: var(--yellow); border-color: var(--yellow); }

  main { flex: 1; display: flex; overflow: hidden; }
  .col-left { width: 420px; min-width: 340px; border-right: 1px solid var(--border);
              display: flex; flex-direction: column; }
  .col-right { flex: 1; display: flex; flex-direction: column; }

  section { padding: 14px 16px; border-bottom: 1px solid var(--border); }
  section h2 {
    font-size: 12px; color: var(--dim); text-transform: uppercase;
    letter-spacing: 1px; margin-bottom: 10px; font-weight: 600;
  }
  textarea {
    width: 100%; height: 110px; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 10px;
    font-family: inherit; font-size: 13px; resize: vertical; outline: none;
  }
  textarea:focus { border-color: var(--accent); }
  .btn-row { display: flex; gap: 10px; margin-top: 10px; }
  button {
    padding: 8px 18px; border-radius: 8px; border: 1px solid var(--border);
    background: #21262d; color: var(--text); font-family: inherit;
    font-size: 13px; cursor: pointer; transition: all .15s;
  }
  button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button.primary { background: #1f6feb; border-color: #1f6feb; color: #fff; }
  button.primary:hover:not(:disabled) { background: #388bfd; }
  button.danger { border-color: var(--red); color: var(--red); display: none; }
  button:disabled { opacity: .45; cursor: not-allowed; }

  .examples { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .example {
    font-size: 12px; color: var(--dim); cursor: pointer; padding: 6px 10px;
    border: 1px dashed var(--border); border-radius: 6px; transition: all .15s;
  }
  .example:hover { color: var(--accent); border-color: var(--accent); }

  #plan-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
  #plan-list li {
    display: flex; gap: 8px; align-items: flex-start; padding: 8px 10px;
    background: var(--bg); border-radius: 6px; border: 1px solid transparent;
    font-size: 13px; line-height: 1.5;
  }
  #plan-list li.in_progress { border-color: var(--yellow); animation: pulse 1.5s infinite; }
  #plan-list li.done { opacity: .65; }
  #plan-list li.failed { border-color: var(--red); opacity: .8; }
  .step-icon { flex-shrink: 0; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(210,153,34,.25);} 50% { box-shadow: 0 0 0 4px rgba(210,153,34,.25);} }

  #trail { flex: 1; overflow-y: auto; padding: 14px 18px; display: flex;
           flex-direction: column; gap: 10px; }
  .evt {
    border: 1px solid var(--border); border-left: 3px solid var(--dim);
    border-radius: 8px; padding: 10px 14px; background: var(--panel);
    animation: slidein .2s ease; font-size: 13px; line-height: 1.6;
  }
  @keyframes slidein { from { opacity: 0; transform: translateY(6px);} to { opacity: 1; transform: none;} }
  .evt .head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
               font-size: 12px; color: var(--dim); }
  .evt.planner  { border-left-color: var(--cyan); }
  .evt.executor { border-left-color: var(--yellow); }
  .evt.tools    { border-left-color: var(--green); }
  .evt.reviewer { border-left-color: var(--purple); }
  .evt.finish   { border-left-color: var(--accent); background: #0c1e33; }
  .evt .tool-name { color: var(--accent); font-weight: 600; }
  .evt pre {
    background: var(--bg); padding: 8px 10px; border-radius: 6px; overflow-x: auto;
    white-space: pre-wrap; word-break: break-all; font-size: 12px; color: var(--dim);
    max-height: 260px; overflow-y: auto;
  }
  .evt img {
    max-width: 100%; border: 1px solid var(--border); border-radius: 6px;
    margin-top: 8px; cursor: zoom-in;
  }
  .verdict { font-weight: 600; }
  .verdict.continue { color: var(--green); }
  .verdict.replan   { color: var(--yellow); }
  .verdict.finish   { color: var(--accent); }
  .final-answer { white-space: pre-wrap; font-size: 14px; color: var(--text); }
  .evt .ts { margin-left: auto; font-size: 11px; }
  .empty-hint { color: var(--dim); text-align: center; margin-top: 60px; font-size: 13px; }
  img.zoom { position: fixed; inset: 40px; max-width: none; width: auto; height: auto;
             max-height: calc(100vh - 80px); margin: auto; z-index: 100; cursor: zoom-out;
             background: rgba(0,0,0,.8); border-radius: 8px; }
</style>
</head>
<body>
<header>
  <h1>⌨ Browser<span>-Agent</span> 控制台</h1>
  <select class="badge" id="model-select" title="切换模型（任务运行中不可切换）">
    <option value="default">模型: …</option>
  </select>
  <div class="badge" id="badge-sandbox">…</div>
  <div class="badge" id="badge-mcp">…</div>
  <div class="badge" id="ws-state">未连接</div>
</header>

<main>
  <div class="col-left">
    <section>
      <h2>任务</h2>
      <textarea id="task-input" placeholder="输入自然语言任务，例如：打开 xxx 页面，提取价格并生成比价报告…"></textarea>
      <div class="btn-row">
        <button class="primary" id="btn-run">▶ 运行</button>
        <button class="danger" id="btn-stop">■ 取消</button>
      </div>
      <div class="examples" id="examples"></div>
    </section>
    <section style="flex:1; overflow-y:auto;">
      <h2>执行计划（Planner）</h2>
      <ul id="plan-list"><li style="border:none;color:var(--dim)">等待任务…</li></ul>
    </section>
  </div>

  <div class="col-right">
    <div id="trail">
      <div class="empty-hint">左侧输入任务并运行<br>这里将实时显示 Planner / Executor / Reviewer 状态机轨迹</div>
    </div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const trail = $("trail");
const STEP_ICON = { pending: "○", in_progress: "◐", done: "●", failed: "✗" };

const EXAMPLES = [
  "打开 eval/cases/popup_overlay.html，领取优惠券后关闭弹窗，用沙箱计算 899-100 的到手价并写入 deal.txt",
  "打开 eval/cases/duplicate_labels.html，点击\"无线耳机 Pro\"商品的查看价格按钮，告诉我点中了哪个商品",
  "搜索\"Playwright 浏览器自动化\"，总结 3 个要点写入 notes.md",
];
EXAMPLES.forEach((text, i) => {
  const div = document.createElement("div");
  div.className = "example";
  div.textContent = `${i + 1}. ${text}`;
  div.onclick = () => { $("task-input").value = text; };
  $("examples").appendChild(div);
});

// --- config badges + model switching ----------------------------------------
fetch("/api/config").then(r => r.json()).then(cfg => {
  $("badge-sandbox").textContent = `沙箱: ${cfg.sandbox_provider}`;
  $("badge-mcp").textContent = `MCP: ${cfg.mcp_servers.join(", ") || "无"}`;
}).catch(() => { $("badge-sandbox").textContent = "配置加载失败"; });

const modelSelect = $("model-select");

function markModelKeyState(hasKey) {
  modelSelect.classList.toggle("no-key", !hasKey);
  modelSelect.title = hasKey
    ? "切换模型（任务运行中不可切换）"
    : "该预设未配置 API Key，切换后任务会失败";
}

function loadModels() {
  fetch("/api/models").then(r => r.json()).then(data => {
    modelSelect.innerHTML = "";
    const def = document.createElement("option");
    def.value = "default";
    def.textContent = `默认: ${data.default_model}`;
    modelSelect.appendChild(def);
    data.presets.forEach(p => {
      const opt = document.createElement("option");
      opt.value = p.id;
      opt.textContent = p.label + (p.api_key_set ? "" : "（无 Key）");
      modelSelect.appendChild(opt);
    });
    modelSelect.value = data.active;
    const activePreset = data.presets.find(p => p.id === data.active);
    markModelKeyState(activePreset ? activePreset.api_key_set : true);
  }).catch(() => { modelSelect.innerHTML = '<option>模型加载失败</option>'; });
}
loadModels();

modelSelect.onchange = async () => {
  const id = modelSelect.value;
  modelSelect.disabled = true;
  try {
    const resp = await fetch("/api/model", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ id }),
    });
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({ detail: resp.statusText }));
      alert(err.detail || "切换失败");
    }
  } catch (e) {
    alert("切换请求失败: " + e.message);
  }
  await loadModels();  // re-sync active state and key hints
  modelSelect.disabled = false;
};

// --- task control ------------------------------------------------------------
let ws = null;

$("btn-run").onclick = async () => {
  const task = $("task-input").value.trim();
  if (!task) { $("task-input").focus(); return; }
  $("btn-run").disabled = true;
  $("btn-stop").style.display = "inline-block";
  modelSelect.disabled = true;
  try {
    const resp = await fetch("/api/task", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ task }),
    });
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({ detail: resp.statusText }));
      alert(err.detail || "任务创建失败");
      resetUI();
      return;
    }
    const { task_id } = await resp.json();
    trail.innerHTML = "";
    connectWS(task_id);
  } catch (e) {
    alert("无法连接服务: " + e.message);
    resetUI();
  }
};

$("btn-stop").onclick = async () => {
  await fetch("/api/task/stop", { method: "POST" }).catch(() => {});
};

function resetUI() {
  $("btn-run").disabled = false;
  $("btn-stop").style.display = "none";
  modelSelect.disabled = false;
  setWSState("未连接", "");
}

function setWSState(text, cls) {
  const el = $("ws-state");
  el.textContent = text;
  el.className = "badge " + (cls || "");
}

function connectWS(taskId) {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/ws/${taskId}`);
  setWSState("连接中…", "warn");
  ws.onopen = () => setWSState("实时同步", "ok");
  ws.onmessage = (msg) => {
    const evt = JSON.parse(msg.data);
    if (evt.node === "__end__") {
      setWSState("已结束", "");
      appendEnd(evt);
      resetUI();
      ws.close();
      return;
    }
    renderEvent(evt);
  };
  ws.onclose = () => { if ($("btn-run").disabled) { setWSState("已断开", "warn"); } };
  ws.onerror = () => setWSState("连接错误", "warn");
}

// --- event rendering ---------------------------------------------------------
function fmtTime(ts) {
  const d = new Date(ts * 1000);
  return d.toTimeString().slice(0, 8);
}

function renderEvent(evt) {
  switch (evt.node) {
    case "planner": {
      const el = evtCard("evt planner", "📋 Planner");
      if (evt.goal) {
        const g = document.createElement("div");
        g.style.color = "var(--dim)"; g.style.marginBottom = "6px";
        g.textContent = `目标: ${evt.goal}`;
        el.appendChild(g);
      }
      trail.appendChild(el);
      if (evt.plan) renderPlan(evt.plan);
      break;
    }
    case "executor": {
      const el = evtCard("evt executor", "⚡ Executor");
      if (evt.notes) evt.notes.forEach(n => {
        const p = document.createElement("div");
        p.style.color = "var(--dim)";
        p.textContent = n;
        el.appendChild(p);
      });
      (evt.tool_calls || []).forEach(call => {
        const p = document.createElement("div");
        p.innerHTML = `调用 → <span class="tool-name">${esc(call.name)}</span>(<span style="color:var(--dim)">${esc(call.arguments)}</span>)`;
        el.appendChild(p);
      });
      if (!evt.tool_calls && !evt.notes) {
        const p = document.createElement("div");
        p.style.color = "var(--dim)"; p.textContent = "思考中…";
        el.appendChild(p);
      }
      trail.appendChild(el);
      if (evt.plan) renderPlan(evt.plan);
      break;
    }
    case "tools": {
      const el = evtCard("evt tools", "🔧 Tools");
      (evt.tool_results || []).forEach(r => {
        const pre = document.createElement("pre");
        pre.textContent = r.output;
        el.appendChild(pre);
        r.screenshots.forEach(url => {
          const img = document.createElement("img");
          img.src = url; img.loading = "lazy";
          img.onclick = () => img.classList.toggle("zoom");
          el.appendChild(img);
        });
      });
      trail.appendChild(el);
      break;
    }
    case "reviewer": {
      const el = evtCard("evt reviewer", "🔍 Reviewer");
      const v = document.createElement("div");
      v.innerHTML = `判定: <span class="verdict ${evt.verdict}">${evt.verdict || "?"}</span>` +
                    ` <span style="color:var(--dim)">${esc(evt.verdict_reason || "")}</span>`;
      el.appendChild(v);
      trail.appendChild(el);
      if (evt.plan) renderPlan(evt.plan);
      break;
    }
    case "finish": {
      const el = evtCard("evt finish", "🏁 完成");
      const ans = document.createElement("div");
      ans.className = "final-answer";
      ans.textContent = evt.final_answer || "（无最终答案）";
      el.appendChild(ans);
      trail.appendChild(el);
      break;
    }
  }
  trail.scrollTop = trail.scrollHeight;
}

function appendEnd(evt) {
  const el = evtCard("evt " + (evt.status === "error" ? "reviewer" : "finish"),
                     evt.status === "error" ? "✗ 出错" :
                     evt.status === "cancelled" ? "⏹ 已取消" : "✅ 任务结束");
  if (evt.error) {
    el.style.borderLeftColor = "var(--red)";
    const pre = document.createElement("pre");
    pre.textContent = evt.error;
    el.appendChild(pre);
  }
  if (evt.final_answer && evt.status !== "error") {
    const ans = document.createElement("div");
    ans.className = "final-answer";
    ans.textContent = evt.final_answer;
    el.appendChild(ans);
  }
  trail.appendChild(el);
  trail.scrollTop = trail.scrollHeight;
}

function evtCard(cls, title) {
  const el = document.createElement("div");
  el.className = cls;
  const head = document.createElement("div");
  head.className = "head";
  head.innerHTML = `<span>${title}</span><span class="ts">${new Date().toTimeString().slice(0, 8)}</span>`;
  el.appendChild(head);
  return el;
}

function renderPlan(plan) {
  const list = $("plan-list");
  list.innerHTML = "";
  plan.forEach(step => {
    const li = document.createElement("li");
    li.className = step.status || "pending";
    li.innerHTML = `<span class="step-icon">${STEP_ICON[step.status] || "○"}</span>` +
                   `<span>步骤 ${step.step_index}: ${esc(step.description)}` +
                   (step.result ? `<br><span style="color:var(--dim);font-size:12px">└ ${esc(step.result.slice(0, 120))}</span>` : "") +
                   `</span>`;
    list.appendChild(li);
  });
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g,
    c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

$("task-input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) $("btn-run").click();
});
</script>
</body>
</html>
