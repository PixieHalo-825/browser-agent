# ============================================================
# Browser-Agent 配置模板
# 不建 config.toml 也能运行（自动回退到本模板），只需设置环境变量 DASHSCOPE_API_KEY；
# 需要改模型/端点/预设时，复制为 config.toml 再改。
# ============================================================

[llm]
# OpenAI 兼容端点：默认阿里云百炼（DashScope），key 从环境变量 DASHSCOPE_API_KEY 读取。
# 也支持 MiMo/DeepSeek/OpenRouter/本地 vLLM 等任何 OpenAI 兼容服务：改 base_url 即可，
# key 用 LLM_API_KEY（通用）或直接填 api_key。
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
api_key = ""
# 文本推理模型（Planner / Executor / Reviewer）
model = "qwen-max"
# 视觉定位模型（GUI-Plus 兜底通道）：需同时支持图片输入与工具调用
vision_model = "qwen3-vl-plus"
# 视觉模型单独的端点（留空则复用 base_url/api_key）
vision_base_url = ""
vision_api_key = ""
temperature = 0.0
max_tokens = 4096

[agent]
max_plan_steps = 10        # 计划最多步骤数
max_replans = 3            # Reviewer 触发 replan 的最大次数
react_max_iterations = 8   # 单步骤 ReAct 循环上限
repeat_call_limit = 3      # 同一调用连续 N 次返回相同结果时，提示模型换方法

# ------------------------------------------------------------
# 可切换模型预设（Web UI 顶栏下拉框 / CLI model 命令）
# 空字段继承 [llm]；指向其他服务端点时需配 base_url + api_key(_env)
# ------------------------------------------------------------
[[model_presets]]
id = "qwen-plus"
label = "Qwen Plus（百炼·均衡）"
model = "qwen-plus"

[[model_presets]]
id = "qwen-flash"
label = "Qwen Flash（百炼·快速）"
model = "qwen-flash"

# 换一家服务商：带上它自己的端点和 key 环境变量
[[model_presets]]
id = "mimo-pro"
label = "MiMo v2.6 Pro（小米）"
base_url = "https://token-plan-cn.xiaomimimo.com/v1"
api_key_env = "MIMO_API_KEY"
model = "mimo-v2.6-pro"
vision_model = "mimo-v2.6-pro"

[browser]
headless = true
viewport_width = 1280
viewport_height = 800
navigation_timeout_ms = 30000
action_timeout_ms = 10000

[dom]
max_elements = 80          # 送入 LLM 的可交互元素上限
max_text_length = 60

[vision]
enabled = true             # GUI-Plus 视觉兜底通道开关
min_confidence = 0.55      # DOM 通道低于该置信度时触发视觉兜底

[sandbox]
# auto: 有 Daytona key 用 Daytona，否则本地 Docker；也可强制 docker / daytona
provider = "auto"
timeout = 30
memory_limit = "512m"
cpu_limit = 1.0
network_enabled = false    # 代码执行沙箱默认断网
daytona_api_key = ""
daytona_server_url = ""
auto_start_docker = true   # Docker Desktop 已安装但引擎未运行时，自动启动并等待
docker_start_timeout = 90

[mcp]
enabled = true
# 热插拔：增删此列表即可启停对应 server（定义见 [mcp_servers.*]）
servers = ["filesystem", "search"]

[search]
# 搜索源按顺序尝试，前一个失败（被限流 / 网络不通 / 没有结果）时自动切到下一个：
#   bing        国内版 Bing 网页结果，无需 key
#   duckduckgo  DuckDuckGo 库，无需 key（大陆网络通常连不上）
#   dashscope   阿里云百炼搜索接口，需要 DASHSCOPE_API_KEY
# 新增搜索源：继承 app/tools/search_providers.py 的 SearchProvider 并注册即可
providers = ["bing", "duckduckgo", "dashscope"]
max_results = 5
timeout = 15

[workspace]
root = "./workspace"

# ------------------------------------------------------------
# MCP Server 启动定义（stdio 传输）。新增工具 server 只需：
# 1. 在 mcp_servers/ 下写一个 FastMCP server
# 2. 在这里加一段定义 + 加入 mcp.servers 列表
# ------------------------------------------------------------
[mcp_servers.filesystem]
command = "python"
args = ["mcp_servers/filesystem_server.py"]

[mcp_servers.search]
command = "python"
args = ["mcp_servers/search_server.py"]

[mcp_servers.browser]
command = "python"
args = ["mcp_servers/browser_server.py"]
